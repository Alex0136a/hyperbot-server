// ── API CLIENT ───────────────────────────────────────────────
const API = window.location.origin;

async function apiCall(path, method="GET", body=null, token=null) {
  const headers = { "Content-Type": "application/json" };
  if (token) headers["Authorization"] = `Bearer ${token}`;
  const r = await fetch(`${API}${path}`, {
    method, headers, body: body ? JSON.stringify(body) : null
  });
  let data = {};
  try { data = await r.json(); } catch(_) { data = { detail: `Erreur serveur (${r.status})` }; }
  if (!r.ok) {
    // v4.4 — FIX : un token invalide/expire (401) faisait rester l app
    // bloquee sur "Chargement..." indefiniment — Promise.all (voir loadData)
    // rejetait a la premiere erreur, donc setConfig() n etait jamais appele
    // et l ecran de connexion ne revenait jamais tout seul. On detecte
    // desormais ce cas precis : on efface le token perime et on recharge la
    // page, ce qui ramene automatiquement a l ecran de connexion.
    // v4.264 — seulement si on ETAIT connecte (token envoye) : sur l ecran
    // de connexion, un 401 = mauvais identifiants, le message doit rester
    // affiche au lieu d etre efface par un rechargement de page.
    if (r.status === 401 && token) {
      localStorage.removeItem("hb_token");
      localStorage.removeItem("hb_email");
      if (!window.__hbRedirectingToLogin) {
        window.__hbRedirectingToLogin = true;
        window.location.reload();
      }
    }
    throw new Error(data.detail || "Erreur serveur");
  }
  return data;
}

// v4.319 — SUR DEMANDE EXPLICITE : telecharge n importe quelle donnee
// d analyse (series de gains/pertes, trades orphelins...) en CSV, pour
// pouvoir l envoyer facilement (ex: a Claude) sans copier-coller un
// tableau. `rows` : tableau de tableaux (1re ligne = en-tetes) ; valeurs
// echappees pour rester valides meme avec des virgules/guillemets dedans.
// v4.325 — SUR DEMANDE EXPLICITE : affichage harmonise avec Hyperliquid, qui
// montre le PnL en % de MARGE (ROE = mouvement de prix x levier). Affichage
// SEULEMENT : les seuils internes du bot (SL, TTP, armement) restent compares
// au mouvement de prix brut (voir bot_engine.py / v4.231).
function _roe(pricePct, lev) {
  if (pricePct === null || pricePct === undefined) return pricePct;
  return lev > 1 ? pricePct * lev : pricePct;
}

// v4.326 — affiche une moyenne avec le nombre de trades reellement utilises
// ("n=2/5") des qu il manque la donnee sur au moins un trade de la serie.
function _avgN(s, avgKey, srcKey, suffix) {
  const v = s[avgKey];
  if (v === null || v === undefined) return "—";
  const n = s.sample_n ? s.sample_n[srcKey] : undefined;
  const tag = (n !== undefined && n < s.length) ? ` (n=${n}/${s.length})` : "";
  return v + (suffix || "") + tag;
}

// v4.337 — resume des refus apres la structure H1 (SL trop loin / sans objectif / R:R)
function funnelRefusals(days) {
  const all = days.flatMap(d => d.rr || []);
  const med = a => { const v=a.filter(x=>x!=null).sort((x,y)=>x-y); return v.length ? v[Math.floor(v.length/2)] : null; };
  const out = [];
  const rr = all.filter(x=>x.k==="rr");
  if (rr.length) out.push([`R:R sous le minimum : ${rr.length} refus, R:R médian ${med(rr.map(x=>x.rr))}, risque médian ${med(rr.map(x=>x.risk))} %, gain médian ${med(rr.map(x=>x.gain))} %`, [...new Set(rr.map(x=>x.t))].join(", ")]);
  const so = all.filter(x=>x.k==="sans_objectif");
  if (so.length) out.push([`Sans objectif réel : ${so.length} refus, risque médian ${med(so.map(x=>x.risk))} %`, [...new Set(so.map(x=>x.t))].join(", ")]);
  const sf = all.filter(x=>x.k==="sl_far");
  if (sf.length) out.push([`SL trop éloigné : ${sf.length} refus, risque médian ${med(sf.map(x=>x.risk))} %`, [...new Set(sf.map(x=>x.t))].join(", ")]);
  return out;
}
function funnelRows(result) {
  const rows = [];
  for (const [mode, label] of Object.entries(FUNNEL_MODES)) {
    const days = ((result.modes||{})[mode]||[]).slice().reverse();
    rows.push([label, ...days.map(d=>d.day), "Total"]);
    for (const [key, lbl] of FUNNEL_STAGES) {
      const vals = days.map(d=>(d.counts||{})[key]||0);
      rows.push([lbl, ...vals, vals.reduce((a,b)=>a+b,0)]);
    }
    // v4.337 — actifs concernes par etape + refus apres H1 (dans le CSV pour analyse)
    const aggA = {};
    days.forEach(d => Object.entries(d.assets||{}).forEach(([st,l]) => { aggA[st] = [...new Set([...(aggA[st]||[]), ...l])]; }));
    for (const [st, lbl] of [["signal_flux","Actifs zone + signal + flux"],["nt_signal_flux","Actifs zone + signal + flux SANS tendance"],["h1","Actifs qui passent la structure H1"],["objectif","Actifs avec un objectif réel"],["candidat","Actifs candidats"]]) {
      if (aggA[st] && aggA[st].length) rows.push([lbl, aggA[st].join(" ")]);
    }
    funnelRefusals(days).forEach(([a,b]) => rows.push([a, b]));
    rows.push([]);
  }
  return rows;
}

function downloadCSV(filename, rows) {
  const esc = v => {
    const s = v === null || v === undefined ? "" : String(v);
    return /[",\n;]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  };
  const csv = rows.map(row => row.map(esc).join(";")).join("\r\n");
  const blob = new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

    ["Debut", fmt(w,s=>s.start), fmt(l,s=>s.start)],

    ["Score/confiance moyen", fmt(w,s=>_avgN(s,"avg_confidence","confidence")), fmt(l,s=>_avgN(s,"avg_confidence","confidence"))],

  return rows;

function groupAdvancedSettingsByMode(settings) {

    if (key.startsWith("ACCUMULATION_")) groups.accumulation.push([key, meta]);

function generateBilan(bilan, paper) {
  if(!bilan) return "Bilan non disponible";
  const sep = "=".repeat(60), thin = "-".repeat(60);
  const now = new Date();
  let t = "";
  t += `${sep}\n  HYPERBOT AI -- BILAN FINANCIER\n${sep}\n`;
  t += `  Date     : ${now.toLocaleDateString("fr-FR")} à ${now.toLocaleTimeString("fr-FR")}\n`;
  t += `${sep}\n\n`;
  
  t += bilan.fees_on
    ? `  MONTANTS NETS DE FRAIS (${bilan.fee_pct} % du notionnel ; frais réels quand ils sont connus). Interrupteur : onglet TRADES P/L.\n\n`
    : `  MONTANTS BRUTS (sans frais). Interrupteur : onglet TRADES P/L.\n\n`;
  t += `[ CAPITAL ]\n${thin}\n`;
  t += `  Balance disponible : ${bilan.balance} USDC\n`;
  t += `  Capital total      : ${bilan.total_capital} USDC\n`;
  t += `  Capital initial    : ${bilan.initial_balance} USDC\n`;
  t += `  Performance        : ${bilan.performance_pct>=0?"+":""}${bilan.performance_pct}%\n`;
  if(bilan.fees_on && bilan.fees_total!=null) t += `  Frais cumulés      : -${bilan.fees_total} USDC (déjà déduits du capital et du solde)\n`;
  t += `  PnL ouvert         : ${bilan.open_pnl>=0?"+":""}${bilan.open_pnl} USDC (${bilan.open_count} trades)\n`;
  if(bilan.running_seconds != null) {
    const diff = Math.floor(bilan.running_seconds);
    const h = Math.floor(diff/3600);
    const m = Math.floor((diff%3600)/60);
    const ratePerH = h > 0 ? (bilan.total?.net / (h + m/60)).toFixed(2) : "N/A";
    t += `  Temps de fonctionnement reel : ${h}h${String(m).padStart(2,"0")} (hors arrets) | Rendement: ${ratePerH} USDC/h\n`;
  } else if(bilan.reset_at) {
    const start = new Date(bilan.reset_at+"Z");
    const diff = Math.floor((new Date() - start) / 1000);
    const h = Math.floor(diff/3600);
    const m = Math.floor((diff%3600)/60);
    const ratePerH = h > 0 ? (bilan.total?.net / (h + m/60)).toFixed(2) : "N/A";
    t += `  Durée trading      : ${h}h${String(m).padStart(2,"0")} | Rendement: ${ratePerH} USDC/h\n`;
  }
  t += `\n`;
  
  t += `[ AUJOURD'HUI ]\n${thin}\n`;
  t += `  Trades total : ${bilan.today.total}\n`;
  t += `  Gains        : ${bilan.today.wins} trades | +${bilan.today.gains} USDC\n`;
  t += `  Pertes       : ${bilan.today.losses} trades | ${bilan.today.pertes} USDC\n`;
  t += `  Win rate     : ${bilan.today.win_rate}%\n`;
  t += `  NET DU JOUR  : ${bilan.today.net>=0?"+":""}${bilan.today.net} USDC${bilan.today.net_pct!=null?` (${bilan.today.net_pct>=0?"+":""}${bilan.today.net_pct}%)`:""}${bilan.today.fees_on?" après frais":""}\n`;
  if(bilan.today.fees_on) t += `  (avant frais : ${bilan.today.net_gross>=0?"+":""}${bilan.today.net_gross} USDC | frais : -${bilan.today.fees} USDC)\n`;
  t += `\n`;
  
  t += `[ TOTAL DEPUIS LE DÉBUT ]\n${thin}\n`;
  t += `  Trades total : ${bilan.total.total}\n`;
  t += `  Gains        : ${bilan.total.wins} trades | +${bilan.total.gains} USDC\n`;
  t += `  Pertes       : ${bilan.total.losses} trades | ${bilan.total.pertes} USDC\n`;
  t += `  Win rate     : ${bilan.total.win_rate}%\n`;
  t += `  NET TOTAL    : ${bilan.total.net>=0?"+":""}${bilan.total.net} USDC${bilan.total.net_pct!=null?` (${bilan.total.net_pct>=0?"+":""}${bilan.total.net_pct}%)`:""}${bilan.total.fees_on?" après frais":""}\n`;
  if(bilan.total.fees_on) t += `  (avant frais : ${bilan.total.net_gross>=0?"+":""}${bilan.total.net_gross} USDC | frais : -${bilan.total.fees} USDC)\n`;
  t += `\n`;
  
  t += `[ 7 DERNIERS JOURS ]${bilan.fees_on?" (nets de frais)":" (bruts)"}\n${thin}\n`;
  (bilan.daily||[]).forEach(d=>{
    t += `  ${d.day} | ✅${d.wins} ❌${d.losses} | ${d.net>=0?"+":""}${Math.round(d.net*100)/100} USDC${d.net_pct!=null?` (${d.net_pct>=0?"+":""}${d.net_pct}%)`:""}\n`;
  });
  
  if(paper) {
    t += `\n[ TRADES OUVERTS ]\n${thin}\n`;
    (paper.open_trades||[]).forEach(tr=>{
      t += `  ${tr.action} ${tr.coin} | Entrée: ${tr.entry_price} | PnL: ${tr.pnl>=0?"+":""}${tr.pnl} USDC\n`;
    });
  }
  
  t += `\n${sep}\n  HyperBot AI · Analyse Claude\n${sep}\n`;
  return t;
}

  const active = signals.filter(s=>s.action!=="WAIT");
  let t = "";
  t += `${sep}
  HYPERBOT AI -- RAPPORT DE SESSION
${sep}
`;
  t += `  Date     : ${now.toLocaleDateString("fr-FR")} a ${now.toLocaleTimeString("fr-FR")}
`;
  t += `  Compte   : ${email}
`;
  t += `  Serveur  : Autonome 24h/24 · Railway
${sep}

`;
  t += `[ RESUME EXECUTIF ]
${thin}
`;
  t += `  Signaux  : ${stats.total||0} (LONG:${stats.longs||0} / SHORT:${stats.shorts||0})
`;
  t += `  Confiance moy. : ${stats.avg_confidence||0}%
`;
  t += `  Risk/Reward moy. : ${stats.avg_rr||"--"}

`;
  t += `[ PRIX MARCHE ]
${thin}
`;
  // v3.2 — FIX : prices contient desormais TOUS les marches Hyperliquid
  // (300+, via le cache WebSocket complet) — on filtre ici pour ne garder
  // que les 30 actifs reellement suivis par ce bot, sinon le rapport
  // devenait illisible (des centaines de tickers bruts sans rapport).
  ALL_COINS.forEach(coin=>{
    const price = prices[coin];
    if(price != null) t+=`  ${coin.padEnd(8)}: $${price.toLocaleString("en-US",{maximumFractionDigits:4})}
`;
  });
  t += `
[ SIGNAUX DETAILLES (${active.length}) ]
${thin}
`;
  active.forEach((sig,i)=>{
    t += `
  [${i+1}] ${sig.action} ${sig.coin}/USDC
`;
    t += `  ${"─".repeat(40)}
`;
    t += `  Date        : ${new Date(sig.created_at).toLocaleString("fr-FR")}
`;
    t += `  Confiance   : ${sig.confidence}%
`;
    t += `  Levier      : x${sig.leverage}
`;
    t += `  Taille pos. : ${sig.position_size}% du capital
`;
    t += `  Risk/Reward : ${sig.risk_reward?.toFixed(2)}
`;
    t += `  Timeframe   : ${sig.timeframe}
`;
    t += `  Entree      : $${sig.entry?.toLocaleString("en-US",{maximumFractionDigits:6})}
`;
    t += `  Stop Loss   : $${sig.stop_loss?.toLocaleString("en-US",{maximumFractionDigits:6})}
`;
    t += `  Take Profit1: $${sig.take_profit1?.toLocaleString("en-US",{maximumFractionDigits:6})}
`;
    t += `  Take Profit2: $${sig.take_profit2?.toLocaleString("en-US",{maximumFractionDigits:6})}
`;
    t += `  Analyse IA  : ${sig.reasoning||"--"}
`;
    const ks = JSON.parse(sig.key_signals||"[]");
    if(ks.length) t += `  Signaux cles: ${ks.join(" | ")}
`;
    t += `  RSI         : ${sig.rsi?.toFixed(1)||"--"}
`;
    t += `  ATR         : ${sig.atr?.toFixed(4)||"--"}
`;
    t += `  VWAP        : ${sig.vwap?.toFixed(2)||"--"}
`;
    if(sig.closed_at) {
      // v3.2 — FIX : le trade est reellement ferme en base — afficher le
      // vrai resultat au lieu de recalculer un statut "en attente" a partir
      // du prix actuel (qui n a plus aucun sens pour un trade deja clos).
      t += `  Statut      : FERME (${sig.reason||"raison inconnue"})
`;
      t += `  Prix sortie : $${sig.exit_price?.toLocaleString("en-US",{maximumFractionDigits:6})}
`;
      t += `  PnL reel    : ${sig.pnl>=0?"+":""}${sig.pnl?.toFixed(2)} USDC
`;
      t += `  Ferme le    : ${new Date(sig.closed_at).toLocaleString("fr-FR")}
`;
    } else {
      const cur = prices[sig.coin];
      if(cur){
        const dir=sig.action==="LONG"?1:-1;
        const pnl=((cur-sig.entry)/sig.entry*100*dir).toFixed(2);
        const tp1=sig.action==="LONG"?cur>=sig.take_profit1:cur<=sig.take_profit1;
        const tp2=sig.action==="LONG"?cur>=sig.take_profit2:cur<=sig.take_profit2;
        const sl=sig.action==="LONG"?cur<=sig.stop_loss:cur>=sig.stop_loss;
        // v4.1 — croise avec la position reelle (taille exacte en $) pour
        // afficher le PnL en $ en plus du % — plus parlant pour estimer la
        // proximite des seuils SL/TTP, qui sont en % de E.
        const matchTrade = (paper?.open_trades||[]).find(p=>p.coin===sig.coin && p.action===sig.action);
        t += `  Statut      : OUVERT
`;
        t += `  Prix actuel : $${cur.toLocaleString()}
`;
        if(matchTrade) t += `  PnL latent  : ${matchTrade.pnl>=0?"+":""}${matchTrade.pnl.toFixed(2)} USDC (${pnl>0?"+":""}${pnl}%)
`;
        else t += `  PnL latent (estimation) : ${pnl>0?"+":""}${pnl}%
`;
        t += `  TP1         : ${tp1?"ATTEINT":"En attente"}
`;
        t += `  TP2         : ${tp2?"ATTEINT":"En attente"}
`;
        t += `  Stop Loss   : ${sl?"TOUCHE":"Intact"}
`;
      } else {
        t += `  Statut      : OUVERT (prix actuel indisponible)
`;
      }
    }
  });
  t += `
${sep}
  Rapport HyperBot AI · Powered by Claude
  Collez ce rapport dans Claude pour analyse
${sep}
`;
  return t;
}

function downloadTxt(content, filename) {
  const b = new Blob([content],{type:"text/plain;charset=utf-8"});
  const u = URL.createObjectURL(b);
  const a = document.createElement("a");
  a.href=u; a.download=filename; a.click();
  URL.revokeObjectURL(u);
}

function downloadCsv(rows, filename) {
  // rows : tableau d objets simples (memes cles pour toutes les lignes)
  if (!rows || !rows.length) return;
  const headers = Object.keys(rows[0]);
  const escape = v => `"${String(v ?? "").replace(/"/g,'""')}"`;
  const lines = [headers.join(","), ...rows.map(r => headers.map(h => escape(r[h])).join(","))];
  const csv = "\uFEFF" + lines.join("\r\n"); // BOM pour un bon affichage des accents dans Excel
  const b = new Blob([csv], {type:"text/csv;charset=utf-8"});
  const u = URL.createObjectURL(b);
  const a = document.createElement("a");
  a.href=u; a.download=filename; a.click();
  URL.revokeObjectURL(u);
}

function MiniChart({ title, labels, datasets, color, height }) {
  const canvasRef = useRef(null);

  useEffect(() => {
    if (!canvasRef.current || typeof Chart === "undefined") return;
    if (chartRef.current) { chartRef.current.destroy(); chartRef.current = null; }
    chartRef.current = new Chart(canvasRef.current, {
      type: "line",
      data: { labels, datasets },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        animation: false,
        interaction: { mode: "index", intersect: false },
        plugins: {
          legend: { display: datasets.length > 1, labels: { color: "#94a3b8", boxWidth: 10, font: { size: 9 } } },
          tooltip: { mode: "index", intersect: false },
        },
        scales: {
          x: { ticks: { color: "#475569", maxTicksLimit: 6, font: { size: 8 } }, grid: { color: "#1e2d4a" } },
          y: { ticks: { color: "#475569", font: { size: 9 } }, grid: { color: "#1e2d4a" } },
        },
      },
    });
    return () => { if (chartRef.current) { chartRef.current.destroy(); chartRef.current = null; } };

// v4.290 — Analyse statistique des stop loss (elargir le SL ? patienter ?)
async function downloadAuthed(path, token, fallbackName) {
  const r = await fetch(`${API}${path}`, {headers:{Authorization:`Bearer ${token}`}});
  if (!r.ok) { let d={}; try{d=await r.json();}catch(_){} throw new Error(d.detail||`Erreur ${r.status}`); }
  const blob = await r.blob();
  const m = (r.headers.get("Content-Disposition")||"").match(/filename="([^"]+)"/);
  const url = URL.createObjectURL(blob); const a = document.createElement("a");
  a.href = url; a.download = m?m[1]:fallbackName; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),2000);
}

function PushPanel({ token, onPrepare }) {

  const [msg, setMsg] = useState("");
  const [busy, setBusy] = useState(false);
  const supported = typeof window !== "undefined" && "serviceWorker" in navigator && "PushManager" in window && "Notification" in window;
  const standalone = (window.navigator && window.navigator.standalone) || (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches);
  const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent || "");
  const refresh = useCallback(async () => {
    try {
      const st = await apiCall("/api/push/status","GET",null,token); setPs(st);
      if (supported) { const reg = await navigator.serviceWorker.ready; const sub = await reg.pushManager.getSubscription(); setHere(!!sub && st.endpoints.includes(sub.endpoint)); }
    } catch(e) { setMsg(e.message); }
  }, [token, supported]);
  useEffect(() => { refresh(); }, [refresh]);
  const u8 = (b64) => { const p = "=".repeat((4 - b64.length % 4) % 4); const r = atob((b64 + p).replace(/-/g,"+").replace(/_/g,"/")); return Uint8Array.from([...r].map(c => c.charCodeAt(0))); };
  const enable = async () => {
    setBusy(true); setMsg("");
    try {
      const perm = await Notification.requestPermission();
      if (perm !== "granted") { setMsg("Notifications refusées : autorise-les dans Réglages > Notifications > HyperBot."); setBusy(false); return; }
      const reg = await navigator.serviceWorker.ready;
      let sub = await reg.pushManager.getSubscription();
      if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: u8(ps.public_key) });
      await apiCall("/api/push/subscribe","POST",{ subscription: sub.toJSON() },token);

        <span>{Number(t.notional_usd).toFixed(2)} $</span>{age!=null && <span>{age < 120 ? `${age} min` : `${Math.round(age/60)} h`}</span>}

          : <span style={{display:"flex",gap:6,alignItems:"center",flexWrap:"wrap"}}>

              {f.market==="perp" && <><span style={{...MT.label,marginTop:8}}>LEVIER</span><input style={MT.input} type="number" min="1" max="20" step="1" value={f.leverage} onChange={e=>set("leverage",e.target.value)}/></>}
              <div style={{fontSize:11,color:"#94a3b8",marginTop:6}}>Marge engagée : {(notional/lev).toFixed(2)} $ · frais estimés ≈ {feesEst.toFixed(3)} $</div>
              {f.mode==="live" && notional<10 && <div style={{fontSize:11,color:"#fca5a5",marginTop:4}}>Minimum Hyperliquid : 10 $ de notionnel.</div>}
            </div>

            <div>
              <span style={MT.label}>STOP LOSS — % / PRIX <span style={{color:"#64748b"}}>({prop.sl_basis})</span></span>
              <div style={{display:"flex",gap:6}}>
                <input style={MT.input} type="number" step="0.05" value={f.sl_pct} onChange={e=>set("sl_pct",e.target.value)}/>
                <input style={MT.input} type="number" step="any" value={refPrice?Number(pxFromPct(Number(f.sl_pct),"sl")).toPrecision(6):""} onChange={e=>{const v=pctFromPx(Number(e.target.value),"sl"); if(v!=null) set("sl_pct",Number(v.toFixed(3)));}}/>
              </div>
              <div style={{fontSize:11,color:"#fca5a5",marginTop:4}}>Perte au SL ≈ {(notional*Number(f.sl_pct)/100).toFixed(2)} $</div>
              <label style={{fontSize:11,color:"#94a3b8",display:"flex",gap:6,marginTop:10,alignItems:"center"}}><input type="checkbox" checked={f.tp_on} onChange={e=>set("tp_on",e.target.checked)}/>TAKE PROFIT — % / PRIX <span style={{color:"#64748b"}}>({prop.tp_basis})</span></label>
              {f.tp_on && <div style={{display:"flex",gap:6,marginTop:4}}>
                <input style={MT.input} type="number" step="0.05" value={f.tp_pct} onChange={e=>set("tp_pct",e.target.value)}/>
                <input style={MT.input} type="number" step="any" value={refPrice?Number(pxFromPct(Number(f.tp_pct),"tp")).toPrecision(6):""} onChange={e=>{const v=pctFromPx(Number(e.target.value),"tp"); if(v!=null) set("tp_pct",Number(v.toFixed(3)));}}/>
              </div>}
              {f.tp_on && <div style={{fontSize:11,color:"#86efac",marginTop:4}}>Gain au TP ≈ {(notional*Number(f.tp_pct)/100).toFixed(2)} $</div>}
              <label style={{fontSize:11,color:"#94a3b8",display:"flex",gap:6,marginTop:8,alignItems:"center"}}><input type="checkbox" checked={!!f.tp_run} onChange={e=>{ const on=e.target.checked; setF(prev=>({...prev, tp_run:on, ...(on?{tp_on:true, tp_pct:(Number(prev.tp_pct)>0?prev.tp_pct:RUN_DEF.tp_pct), tp_run_lock_pct:(prev.tp_run_lock_pct===""||prev.tp_run_lock_pct==null?RUN_DEF.lock:prev.tp_run_lock_pct), tp_run_trail_pct:(Number(prev.tp_run_trail_pct)>0?prev.tp_run_trail_pct:RUN_DEF.trail)}:{})})); }}/>LAISSER COURIR AU TP <span style={{color:"#64748b"}}>(à l'objectif : gain verrouillé puis stop suiveur)</span></label>
              {f.tp_on && f.tp_run && <div style={{display:"flex",gap:6,marginTop:4}}>
                <div style={{flex:1}}><span style={MT.label}>GAIN VERROUILLÉ (+%)</span><input style={MT.input} type="number" step="0.05" value={f.tp_run_lock_pct} onChange={e=>set("tp_run_lock_pct",e.target.value)}/></div>
                <div style={{flex:1}}><span style={MT.label}>SUIVEUR SOUS LE PLUS HAUT (%)</span><input style={MT.input} type="number" step="0.05" value={f.tp_run_trail_pct} onChange={e=>set("tp_run_trail_pct",e.target.value)}/></div>
              </div>}
              {f.tp_on && <label style={{fontSize:11,color:"#94a3b8",display:"flex",gap:6,marginTop:8,alignItems:"center"}}><input type="checkbox" checked={!!f.tp1_on} onChange={e=>{ const on=e.target.checked; setF(prev=>({...prev, tp1_on:on, ...(on?{tp1_pct:(Number(prev.tp1_pct)>0?prev.tp1_pct:Number((Number(prev.tp_pct)/2).toFixed(3))), tp1_close_pct:(Number(prev.tp1_close_pct)>0?prev.tp1_close_pct:50)}:{})})); }}/>TP1 — CLÔTURE PARTIELLE <span style={{color:"#64748b"}}>(le TP ci-dessus devient le TP2 : le reste de la position)</span></label>}
              {f.tp_on && f.tp1_on && <div style={{display:"flex",gap:6,marginTop:4,alignItems:"flex-end",flexWrap:"wrap"}}>
                <div style={{flex:1}}><span style={MT.label}>TP1 (%)</span><input style={MT.input} type="number" step="0.05" value={f.tp1_pct} onChange={e=>set("tp1_pct",e.target.value)}/></div>
                <div style={{flex:1}}><span style={MT.label}>TP1 (prix)</span><input style={MT.input} type="number" step="any" value={refPrice&&Number(f.tp1_pct)>0?Number(pxFromPct(Number(f.tp1_pct),"tp")).toPrecision(6):""} onChange={e=>{const v=pctFromPx(Number(e.target.value),"tp"); if(v!=null) set("tp1_pct",Number(v.toFixed(3)));}}/></div>
                <div style={{flex:1}}><span style={MT.label}>PART CLÔTURÉE (%)</span><input style={MT.input} type="number" min="5" max="95" step="5" value={f.tp1_close_pct} onChange={e=>set("tp1_close_pct",e.target.value)}/></div>
                <label style={{fontSize:11,color:"#94a3b8",display:"flex",gap:4,alignItems:"center"}}><input type="checkbox" checked={!!f.tp1_be} onChange={e=>set("tp1_be",e.target.checked)}/>SL au seuil de rentabilité après TP1</label>
              </div>}
              {f.tp_on && f.tp1_on && Number(f.tp1_pct)>0 && <div style={{fontSize:11,color:"#86efac",marginTop:4}}>Gain au TP1 ≈ {(notional*Number(f.tp1_close_pct)/100*Number(f.tp1_pct)/100).toFixed(2)} $ · au TP2 ≈ {(notional*(1-Number(f.tp1_close_pct)/100)*Number(f.tp_pct)/100).toFixed(2)} $ sur le reste</div>}
            </div>

            <div>
              <label style={{fontSize:11,color:"#94a3b8",display:"flex",gap:6,alignItems:"center"}}><input type="checkbox" checked={f.ttp_on} onChange={e=>set("ttp_on",e.target.checked)}/>TRAILING TAKE PROFIT</label>
              {f.ttp_on && <div style={{display:"flex",gap:6,marginTop:6}}>
                <div style={{flex:1}}><span style={MT.label}>ARMEMENT (+%)</span><input style={MT.input} type="number" step="0.05" value={f.ttp_arm_pct} onChange={e=>set("ttp_arm_pct",e.target.value)}/></div>
                <div style={{flex:1}}><span style={MT.label}>REPLI TOLÉRÉ (%)</span><input style={MT.input} type="number" step="0.05" value={f.ttp_trail_pct} onChange={e=>set("ttp_trail_pct",e.target.value)}/></div>
              </div>}
              <div style={{fontSize:10,color:"#64748b",marginTop:6}}>Une fois le gain atteint, sortie si le prix rend le repli indiqué depuis son meilleur niveau.</div>
            </div>

            <div>
              <label style={{fontSize:11,color:"#94a3b8",display:"flex",gap:6,alignItems:"center"}}><input type="checkbox" checked={!!f.lock_on} onChange={e=>set("lock_on",e.target.checked)}/>SL DYNAMIQUE (verrou progressif)</label>
              {f.lock_on && <div style={{display:"flex",gap:6,marginTop:6}}>
                <div style={{flex:1}}><span style={MT.label}>DÈS UN GAIN DE (+%)</span><input style={MT.input} type="number" step="0.05" value={f.lock_arm_pct} onChange={e=>set("lock_arm_pct",e.target.value)}/></div>
                <div style={{flex:1}}><span style={MT.label}>PART GARANTIE (%)</span><input style={MT.input} type="number" min="5" max="95" step="5" value={f.lock_fraction_pct} onChange={e=>set("lock_fraction_pct",e.target.value)}/></div>
              </div>}
              {f.lock_on && Number(f.lock_arm_pct)>0 && <div style={{fontSize:11,color:"#86efac",marginTop:4}}>Exemple : à un pic de +{(Number(f.lock_arm_pct)*2).toFixed(2)} %, le SL garantit au moins +{(Number(f.lock_arm_pct)*2*Number(f.lock_fraction_pct)/100).toFixed(2)} %.</div>}
              <div style={{fontSize:10,color:"#64748b",marginTop:6}}>Le SL ne fait que monter (long) ou descendre (short). En live perp, le SL natif Hyperliquid est mis à jour (écart minimal 0,05 %).</div>
            </div>

            <div>
              <span style={MT.label}>TENDANCE H4 — CONDITION D'ENTRÉE</span>
              <select style={MT.input} value={f.trend_entry} onChange={e=>set("trend_entry",e.target.value)}>
                <option value="">Aucune</option><option value="haussiere">Haussière</option><option value="baissiere">Baissière</option><option value="neutre">Neutre</option>
              </select>
              <span style={{...MT.label,marginTop:8}}>TENDANCE H4 — SORTIE</span>
              <select style={MT.input} value={f.trend_exit} onChange={e=>set("trend_exit",e.target.value)}>
                <option value="">Aucune</option><option value="opposee">Si la tendance devient opposée au sens du trade</option><option value="perdue">Si la tendance n'est plus celle du sens du trade</option>
              </select>
              {prop.trend && prop.trend.ok && prop.trend.data_fresh && f.trend_exit && (f.trend_exit==="opposee" ? prop.trend.trend===(isLong?"baissiere":"haussiere") : prop.trend.trend!==(isLong?"haussiere":"baissiere")) &&
                <div style={{fontSize:11,color:"#fca5a5",marginTop:6,background:"#7f1d1d33",border:"1px solid #7f1d1d",borderRadius:6,padding:6}}>⚠️ La tendance H4 de {sel.ticker} est déjà {TREND_LBL[prop.trend.trend]} : avec cette règle de sortie, la position se fermerait aussitôt après l'ouverture. L'ordre sera refusé.</div>}
              {prop.trend && <div style={{fontSize:11,color:prop.trend.ok&&prop.trend.data_fresh?"#94a3b8":"#fbbf24",marginTop:6}}>
                {prop.trend.ok ? `Tendance H4 actuelle de ${sel.ticker} : ${TREND_LBL[prop.trend.trend]||prop.trend.trend}${prop.trend.data_fresh?"":" — données périmées"}`
                               : `Tendance H4 indisponible (${prop.trend.why}) — une condition d'entrée refuserait l'ordre.`}
              </div>}
              <div style={{fontSize:10,color:"#64748b",marginTop:6}}>Tendance calculée comme pour le top-down (EMA50/EMA200 sur bougies H4 clôturées + prix live). Une condition d'entrée refuse l'ordre si la tendance est indisponible ou périmée.</div>
            </div>
          </div>

          <div style={{display:"flex",justifyContent:"flex-end",gap:10,marginTop:16}}>
            <button disabled={busy||!oppStillValid} style={{...MT.btn(f.mode==="live"?"#ef4444":"#22c55e",f.mode==="live"?"#fff":"#04101f"),opacity:busy||!oppStillValid?0.5:1,padding:"11px 20px",fontSize:13}} onClick={submit}>
              {busy?"Envoi...":`${f.execution==="now"?"Ouvrir maintenant":"Programmer l'ordre"} — ${f.mode==="live"?"🔴 LIVE":"🎮 PAPER"}`}
            </button>
          </div>
        </div>
      )}

      {/* ORDRES PROGRAMMES */}
      <div style={MT.card}>
        <div style={MT.title}>⏰ ORDRES PROGRAMMÉS ({st.scheduled.length})</div>
        {st.scheduled.length===0 ? <div style={{fontSize:12,color:"#64748b"}}>Aucun ordre en attente.</div> : (
          <div style={{overflowX:"auto"}}><table style={{borderCollapse:"collapse",width:"100%"}}>
            <thead><tr>{["#","Actif","Sens","Marché","Mode","Déclenchement","Prix actuel","Opportunité","Expire",""].map(h=><th key={h} style={MT.th}>{h}</th>)}</tr></thead>
            <tbody>{st.scheduled.map(o=><React.Fragment key={o.id}><tr>
              <td style={MT.td}>{o.id}</td><td data-tk={o.ticker} title="Résumé de l'actif" style={{...MT.td,fontWeight:800,cursor:"pointer",textDecoration:"underline dotted"}}>{o.ticker}</td><td style={MT.td}>{dirBadge(o.direction)}</td>
              <td style={MT.td}>{o.market.toUpperCase()}</td><td style={{...MT.td,color:o.mode==="live"?"#ef4444":"#22c55e"}}>{o.mode.toUpperCase()}</td>
              <td style={MT.td}>{o.execution==="price_above"?`prix ≥ ${fmtP(o.trigger_price)}`:o.execution==="price_below"?`prix ≤ ${fmtP(o.trigger_price)}`:`à ${fmtTime(o.trigger_time)}`}</td>
              <td style={MT.td}>{fmtP(o.current_price)}</td>
              <td style={{...MT.td,color:o.opportunity_valid?"#22c55e":"#fbbf24"}}>{o.strategy_source==="libre"?"ordre libre":(o.strategy_source==="swing_support"?"Swing Support":(o.opportunity_valid?"valable":"non confirmée"))}</td>
              <td style={MT.td}>{fmtTime(o.expires_at)}</td>
              <td style={MT.td}><button style={MT.btn("#1e2d4a","#93c5fd")} onClick={()=>openSchedEdit(o)}>Modifier</button> <button style={MT.btn("#1e2d4a","#fca5a5")} onClick={()=>cancelOrder(o.id)}>Annuler</button></td>
            </tr>
            {schedId===o.id && <tr><td colSpan={10} style={{...MT.td,background:"#0b1222"}}>
              <div style={{display:"flex",gap:10,flexWrap:"wrap",alignItems:"flex-end",padding:"6px 0"}}>
                <div><span style={MT.label}>SENS</span><select style={{...MT.input,width:100}} value={sched.direction} onChange={e=>setSched({...sched,direction:e.target.value})}><option value="long">LONG</option>{o.market!=="spot" && <option value="short">SHORT</option>}</select></div>
                <div><span style={MT.label}>MODE</span><select style={{...MT.input,width:100}} value={sched.mode} onChange={e=>setSched({...sched,mode:e.target.value})}><option value="paper">PAPER</option><option value="live">🔴 LIVE</option></select></div>
                {sched.direction!==o.direction && o.strategy_source!=="libre" && o.strategy_source!=="swing_support" && <div style={{fontSize:11,color:"#fbbf24",maxWidth:220}}>Sens inversé : l'ordre ne suit plus l'opportunité du bot, il devient un ordre libre.</div>}
                <div><span style={MT.label}>DÉCLENCHEMENT</span><select style={{...MT.input,width:150}} value={sched.execution} onChange={e=>setSched({...sched,execution:e.target.value})}><option value="price_above">Prix ≥ (monte à)</option><option value="price_below">Prix ≤ (descend à)</option><option value="time">À une heure précise</option></select></div>
                {(sched.execution==="price_above"||sched.execution==="price_below") && <div><span style={MT.label}>PRIX DE DÉCLENCHEMENT</span><input style={{...MT.input,width:130}} type="number" step="any" value={sched.trigger_price} onChange={e=>setSched({...sched,trigger_price:e.target.value})}/></div>}
                {sched.execution==="time" && <div><span style={MT.label}>HEURE DE DÉCLENCHEMENT</span><input style={{...MT.input,width:190}} type="datetime-local" value={sched.trigger_time} onChange={e=>setSched({...sched,trigger_time:e.target.value})}/></div>}
                <div><span style={MT.label}>TENDANCE H4 — CONDITION D'ENTRÉE</span><select style={{...MT.input,width:150}} value={sched.trend_entry} onChange={e=>setSched({...sched,trend_entry:e.target.value})}><option value="">Aucune</option><option value="haussiere">Haussière</option><option value="baissiere">Baissière</option><option value="neutre">Neutre</option></select></div>
                {o.strategy_source!=="libre" && o.strategy_source!=="swing_support" && sched.direction===o.direction && <label style={{fontSize:11,color:"#94a3b8",display:"flex",gap:4,alignItems:"center"}}><input type="checkbox" checked={!!sched.require_valid} onChange={e=>setSched({...sched,require_valid:e.target.checked})}/>annuler si l'opportunité du bot n'est plus valable au déclenchement</label>}
                <div><span style={MT.label}>TAILLE ($)</span><input style={{...MT.input,width:90}} type="number" step="any" value={sched.notional_usd} onChange={e=>setSched({...sched,notional_usd:e.target.value})}/></div>
                {o.market!=="spot" && <div><span style={MT.label}>LEVIER</span><input style={{...MT.input,width:70}} type="number" min="1" step="1" value={sched.leverage} onChange={e=>setSched({...sched,leverage:e.target.value})}/></div>}
                <div><span style={MT.label}>SL (%)</span><input style={{...MT.input,width:80}} type="number" step="0.05" value={sched.sl_pct} onChange={e=>setSched({...sched,sl_pct:e.target.value})}/></div>
                <div><span style={MT.label}>SL (prix)</span><input style={{...MT.input,width:110}} type="number" step="any" value={sPx(o,sched.sl_pct,"sl")} onChange={e=>setSched({...sched,sl_pct:sPct(o,e.target.value)})}/></div>
                <div><span style={MT.label}>TP / TP2 (%, vide = aucun)</span><input style={{...MT.input,width:110}} type="number" step="0.05" value={sched.tp_pct} onChange={e=>setSched({...sched,tp_pct:e.target.value})}/></div>
                <div><span style={MT.label}>TP / TP2 (prix)</span><input style={{...MT.input,width:110}} type="number" step="any" value={sPx(o,sched.tp_pct,"tp")} onChange={e=>setSched({...sched,tp_pct:sPct(o,e.target.value)})}/></div>
                <label style={{fontSize:11,color:"#94a3b8",display:"flex",gap:4,alignItems:"center"}}><input type="checkbox" checked={!!sched.tp_run} onChange={e=>{ const on=e.target.checked; setSched(prev=>on ? {...prev, tp_run:true, tp_pct:(Number(prev.tp_pct)>0?prev.tp_pct:RUN_DEF.tp_pct), tp_run_lock_pct:(prev.tp_run_lock_pct===""||prev.tp_run_lock_pct==null?RUN_DEF.lock:prev.tp_run_lock_pct), tp_run_trail_pct:(Number(prev.tp_run_trail_pct)>0?prev.tp_run_trail_pct:RUN_DEF.trail)} : {...prev,tp_run:false}); }}/>laisser courir au TP</label>
                {sched.tp_run && <><div><span style={MT.label}>VERROU (+%)</span><input style={{...MT.input,width:80}} type="number" step="0.05" value={sched.tp_run_lock_pct} onChange={e=>setSched({...sched,tp_run_lock_pct:e.target.value})}/></div>
                <div><span style={MT.label}>SUIVEUR (%)</span><input style={{...MT.input,width:80}} type="number" step="0.05" value={sched.tp_run_trail_pct} onChange={e=>setSched({...sched,tp_run_trail_pct:e.target.value})}/></div></>}
                <div><span style={MT.label}>TP1 (%, vide = aucun)</span><input style={{...MT.input,width:100}} type="number" step="0.05" value={sched.tp1_pct} onFocus={()=>{ if(sched.tp1_pct===""&&Number(sched.tp_pct)>0) setSched(prev=>({...prev,tp1_pct:Number((Number(prev.tp_pct)/2).toFixed(3))})); }} onChange={e=>setSched({...sched,tp1_pct:e.target.value})}/></div>
                <div><span style={MT.label}>TP1 (prix)</span><input style={{...MT.input,width:110}} type="number" step="any" value={sPx(o,sched.tp1_pct,"tp")} onFocus={()=>{ if(sched.tp1_pct===""&&Number(sched.tp_pct)>0) setSched(prev=>({...prev,tp1_pct:Number((Number(prev.tp_pct)/2).toFixed(3))})); }} onChange={e=>setSched({...sched,tp1_pct:sPct(o,e.target.value)})}/></div>
                {sched.tp1_pct!=="" && sched.tp1_pct!=null && <><div><span style={MT.label}>PART CLÔTURÉE (%)</span><input style={{...MT.input,width:90}} type="number" min="5" max="95" step="5" value={sched.tp1_close_pct} onChange={e=>setSched({...sched,tp1_close_pct:e.target.value})}/></div>
                <label style={{fontSize:11,color:"#94a3b8",display:"flex",gap:4,alignItems:"center"}}><input type="checkbox" checked={!!sched.tp1_be} onChange={e=>setSched({...sched,tp1_be:e.target.checked})}/>SL au seuil de rentabilité après TP1</label></>}
                <div><span style={MT.label}>TTP armement %</span><input style={{...MT.input,width:90}} type="number" step="0.05" value={sched.ttp_arm_pct} disabled={sched.ttp_off} onChange={e=>setSched({...sched,ttp_arm_pct:e.target.value})}/></div>
                <div><span style={MT.label}>TTP repli %</span><input style={{...MT.input,width:90}} type="number" step="0.05" value={sched.ttp_trail_pct} disabled={sched.ttp_off} onChange={e=>setSched({...sched,ttp_trail_pct:e.target.value})}/></div>
                <label style={{fontSize:11,color:"#94a3b8",display:"flex",gap:4,alignItems:"center"}}><input type="checkbox" checked={sched.ttp_off} onChange={e=>setSched({...sched,ttp_off:e.target.checked})}/>sans TTP</label>
                <div><span style={MT.label}>VERROU dès +%</span><input style={{...MT.input,width:80}} type="number" step="0.05" value={sched.lock_arm_pct} disabled={sched.lock_off} onChange={e=>setSched({...sched,lock_arm_pct:e.target.value})}/></div>
                <div><span style={MT.label}>PART GARANTIE %</span><input style={{...MT.input,width:80}} type="number" min="5" max="95" step="5" value={sched.lock_fraction_pct} disabled={sched.lock_off} onChange={e=>setSched({...sched,lock_fraction_pct:e.target.value})}/></div>
                <label style={{fontSize:11,color:"#94a3b8",display:"flex",gap:4,alignItems:"center"}}><input type="checkbox" checked={sched.lock_off} onChange={e=>setSched({...sched,lock_off:e.target.checked})}/>sans verrou</label>
                <div><span style={MT.label}>TENDANCE H4 — SORTIE</span><select style={{...MT.input,width:200}} value={sched.trend_exit} onChange={e=>setSched({...sched,trend_exit:e.target.value})}><option value="">Aucune</option><option value="opposee">Si la tendance devient opposée</option><option value="perdue">Si la tendance n'est plus celle du sens</option></select></div>
                <div><span style={MT.label}>EXPIRE DANS (h, vide = inchangé)</span><input style={{...MT.input,width:90}} type="number" step="any" value={sched.expiry_hours} onChange={e=>setSched({...sched,expiry_hours:e.target.value})}/></div>
                <button style={MT.btn("#60a5fa")} onClick={()=>saveSched(o)}>Enregistrer</button>
              </div>
            </td></tr>}
            </React.Fragment>)}</tbody>
          </table></div>)}
      </div>

      {/* POSITIONS MANUELLES */}
      <div style={MT.card}>
        <div style={MT.title}>📈 POSITIONS MANUELLES OUVERTES ({st.positions.length})

    </div>
  );
}

      const utcS = String(now.getUTCSeconds()).padStart(2,"0");
      const utcStr = `${String(utcH).padStart(2,"0")}:${utcM}:${utcS}`;
      // GMT-4 toute l'année (AST fixe)
      const localH = (utcH - 4 + 24) % 24;
      const localStr = `${String(localH).padStart(2,"0")}:${utcM}:${utcS}`;
      // Statut marché
      const day = now.getUTCDay(); // 0=dim, 6=sam
      const isWeekend = day === 0 || day === 6;

      const qStart = config?.offpeak_hour_start ?? 21;

      setClock({utc: utcStr, local: localStr, market, marketColor});
    };
    updateClock();
    const id = setInterval(updateClock, 1000);

          </div>

          {/* PAR ACTIF */}
          <div style={{background:"#0a1628",border:"1px solid #1e3a5f",borderRadius:12,padding:16,marginTop:12}}>
            <div style={{fontSize:11,color:"#94a3b8",marginBottom:8,letterSpacing:1}}>🎯 PERFORMANCE PAR ACTIF</div>
            {(bilan.by_coin||[]).map((coin,i)=>{
              const h = Math.floor((coin.total_minutes||0)/60);
              const m = (coin.total_minutes||0)%60;
              const timeStr = h>0?`${h}h${String(m).padStart(2,"0")}`:`${m}min`;
              return (
                <div key={i} style={{padding:"8px 0",borderBottom:"1px solid #0f1629"}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:3}}>
                    <span style={{fontSize:12,fontWeight:700,color:"#e2e8f0"}}>{coin.coin}</span>
                    <span style={{fontSize:12,fontWeight:800,color:coin.net>=0?"#34d399":"#f87171"}}>
                      {coin.net>=0?"+":""}{coin.net}$
                    </span>
                  </div>
                  <div style={{display:"flex",justifyContent:"space-between",fontSize:10,color:"#94a3b8"}}>
                    <span>✅{coin.wins} (+{coin.avg_gain}$) ❌{coin.losses} ({coin.avg_loss}$)</span>
                    <span style={{color:coin.win_rate>=50?"#34d399":"#f87171"}}>{coin.win_rate}%</span>
                  </div>
                  <div style={{fontSize:9,color:"#94a3b8",marginTop:2}}>
                    ⏱️ {timeStr} de trading · {coin.total} trades
                  </div>
                </div>
              );
            })}
          </div>
          </>)}
        </div>
      )}

      {/* BILAN LIVE — v4.90 SUR DEMANDE EXPLICITE : capital reel Hyperliquid,
      PnL ouvert, performance, trades ouverts et win rate — completement
      separe du bilan paper ci-dessus, jamais melange. */}
      {tab==="bilan_live" && (
        <div style={{padding:14}}>
          {!bilanLive ? <div style={{color:"#94a3b8",fontSize:12,textAlign:"center",padding:40}}>
            <button onClick={()=>apiCall("/api/bilan-live","GET",null,token).then(r=>setBilanLive(r))}
              style={{background:"#2d0a0a",border:"1px solid #f87171",borderRadius:8,padding:"10px 20px",color:"#f87171",cursor:"pointer"}}>
              🔴 Charger le bilan live
            </button>
          </div> : (<>
          <div style={{background:"#1a0a0a",border:"1px solid #4a1e1e",borderRadius:12,padding:16,marginBottom:12}}>
            <div style={{fontSize:11,color:"#f87171",letterSpacing:1,marginBottom:12,fontWeight:700}}>🔴 CAPITAL HYPERLIQUID (RÉEL)</div>
            <div style={{fontSize:28,fontWeight:800,color:"#fff"}}>${bilanLive.hyperliquid_capital.toFixed(2)}</div>
            <div style={{fontSize:10,marginTop:4,color:bilanLive.hyperliquid_reachable?"#34d399":"#f87171"}}>
              {bilanLive.hyperliquid_reachable ? "✅ Solde synchronisé en direct" : "⚠️ Connexion Hyperliquid indisponible — dernière valeur connue affichée"}
            </div>
            {bilanLive.hyperliquid_error && (
              <div style={{fontSize:9,color:"#f87171",marginTop:2,fontFamily:"monospace"}}>{bilanLive.hyperliquid_error}</div>
            )}
            <div style={{fontSize:11,color:"#94a3b8",marginTop:4}}>Capital total (avec PnL) : <span style={{color:"#fff",fontWeight:700}}>${bilanLive.total_capital_live.toFixed(2)}</span></div>
            <div style={{fontSize:11,marginTop:2,color:bilanLive.performance_pct>=0?"#34d399":"#f87171"}}>
              Performance : {bilanLive.performance_pct>=0?"+":""}{bilanLive.performance_pct.toFixed(2)}%
            </div>
          </div>

          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(150px,1fr))",gap:10,marginBottom:12}}>
            <div style={{background:"#0a0e1a",border:"1px solid #1e2d4a",borderRadius:8,padding:12}}>
              <div style={{fontSize:10,color:"#94a3b8",marginBottom:4}}>PnL OUVERT</div>
              <div style={{fontSize:18,fontWeight:700,color:bilanLive.open_pnl>=0?"#34d399":"#f87171"}}>
                {bilanLive.open_pnl>=0?"+":""}${bilanLive.open_pnl.toFixed(2)}
              </div>
            </div>
            <div style={{background:"#0a0e1a",border:"1px solid #1e2d4a",borderRadius:8,padding:12}}>
              <div style={{fontSize:10,color:"#94a3b8",marginBottom:4}}>TRADES OUVERTS</div>
              <div style={{fontSize:18,fontWeight:700,color:"#fff"}}>{bilanLive.open_count}</div>
            </div>
            <div style={{background:"#0a0e1a",border:"1px solid #1e2d4a",borderRadius:8,padding:12}}>
              <div style={{fontSize:10,color:"#94a3b8",marginBottom:4}}>WIN RATE</div>
              <div style={{fontSize:18,fontWeight:700,color:"#fff"}}>{bilanLive.win_rate}%</div>
              <div style={{fontSize:9,color:"#475569"}}>{bilanLive.wins}G / {bilanLive.losses}P sur {bilanLive.total_trades}</div>
            </div>
            <div style={{background:"#0a0e1a",border:"1px solid #1e2d4a",borderRadius:8,padding:12}}>
              <div style={{fontSize:10,color:"#94a3b8",marginBottom:4}}>NET RÉALISÉ</div>
              <div style={{fontSize:18,fontWeight:700,color:bilanLive.net_realized>=0?"#34d399":"#f87171"}}>
                {bilanLive.net_realized>=0?"+":""}${bilanLive.net_realized.toFixed(2)}
              </div>
            </div>
          </div>

          {bilanLive.open_positions.length > 0 && (
            <div style={{background:"#0a0e1a",border:"1px solid #1e2d4a",borderRadius:8,padding:12}}>
              <div style={{fontSize:10,color:"#94a3b8",marginBottom:8,fontWeight:700}}>POSITIONS LIVE OUVERTES</div>
              {bilanLive.open_positions.map((p,i)=>(
                <div key={i} style={{display:"flex",justifyContent:"space-between",padding:"6px 0",borderBottom:i<bilanLive.open_positions.length-1?"1px solid #1e2d4a":"none",fontSize:11}}>
                  <span style={{color:"#fff"}}>{p.action} {p.coin}</span>
                  <span style={{color:p.pnl>=0?"#34d399":"#f87171",fontWeight:700}}>{p.pnl>=0?"+":""}${p.pnl.toFixed(2)} ({p.pnl_pct.toFixed(2)}%)</span>
                </div>
              ))}
            </div>
          )}
          <button onClick={()=>apiCall("/api/bilan-live","GET",null,token).then(r=>setBilanLive(r))}
            style={{marginTop:12,background:"#1e2d4a",border:"1px solid #334155",borderRadius:6,padding:"6px 14px",color:"#94a3b8",fontSize:10,cursor:"pointer"}}>
            🔄 Rafraîchir
          </button>
          </>)}
        </div>
      )}

      {/* RAPPORT */}
      {tab==="rapport" && (
        <div style={{padding:16,maxWidth:800}}>
          <div style={{background:"#0f1629",border:"1px solid #1e2d4a",borderRadius:10,padding:20,marginBottom:14}}>
            <div style={{fontSize:13,fontWeight:700,color:"#60a5fa",marginBottom:4}}>📄 Rapport de session</div>
            <div style={{fontSize:11,color:"#94a3b8",marginBottom:16,lineHeight:1.7}}>
              Exportez tous les signaux avec niveaux, suivi TP/SL et analyse IA. Collez dans Claude pour analyse approfondie.
            </div>
            <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:8,marginBottom:16}}>
              {[{l:"Signaux",v:stats.total||0,c:"#60a5fa"},{l:"Confiance moy.",v:`${stats.avg_confidence||0}%`,c:confColor(stats.avg_confidence||0)},{l:"R/R moyen",v:stats.avg_rr||"--",c:"#c084fc"}].map((s,i)=>(
                <div key={i} style={{background:"#0a0e1a",borderRadius:6,padding:"9px",textAlign:"center"}}>
                  <div style={{fontSize:18,fontWeight:700,color:s.c}}>{s.v}</div>
                  <div style={{fontSize:9,color:"#94a3b8",marginTop:2}}>{s.l}</div>
                </div>
              ))}
            </div>
            <div style={{background:"#0a0e1a",borderRadius:7,padding:12,marginBottom:14}}>
              <div style={{fontSize:10,color:"#94a3b8",marginBottom:8,letterSpacing:1,display:"flex",justifyContent:"space-between"}}>
                <span>SUIVI TP/SL EN TEMPS REEL</span>
                <span style={{color:"#64748b",letterSpacing:0}}>
                  {lastUpdate ? `Donnees mises a jour il y a ${Math.floor((new Date()-lastUpdate)/1000)}s` : ""}
                </span>
              </div>
              {signals.filter(s=>s.action!=="WAIT" && !s.closed_at).length===0
                ?<div style={{color:"#94a3b8",fontSize:11}}>Aucun signal ouvert a suivre actuellement.</div>
                :signals.filter(s=>s.action!=="WAIT" && !s.closed_at).slice(0,10).map(sig=>{
                  const cur=prices[sig.coin]; if(!cur) return null;
                  const dir=sig.action==="LONG"?1:-1;
                  const pnl=((cur-sig.entry)/sig.entry*100*dir).toFixed(2);
                  const tp1=sig.action==="LONG"?cur>=sig.take_profit1:cur<=sig.take_profit1;
                  const tp2=sig.action==="LONG"?cur>=sig.take_profit2:cur<=sig.take_profit2;
                  const sl=sig.action==="LONG"?cur<=sig.stop_loss:cur>=sig.stop_loss;
                  // v4.1 — croise avec la position reelle (taille exacte en $)
                  // pour afficher le PnL en $ — bien plus parlant pour estimer
                  // la proximite des seuils SL/TTP (exprimes en % de E).
                  const matchPos = (positions||[]).find(p=>p.coin===sig.coin && p.action===sig.action);
                  const pnlUsd = matchPos ? matchPos.pnl : null;
                  const peakPct = matchPos ? matchPos.peak_pnl_pct : null;
                  const peakUsdFallback = matchPos ? matchPos.peak_pnl : null;
                  return (
                    <div key={sig.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"6px 0",borderBottom:"1px solid #0f1629"}}>
                      <div style={{display:"flex",gap:7,alignItems:"center"}}>
                        <span style={{color:sig.action==="LONG"?"#34d399":"#f87171",fontSize:10,fontWeight:700}}>{sig.action}</span>
                        <span style={{color:"#e2e8f0",fontSize:11}}>{sig.coin}</span>
                        <span style={{color:"#94a3b8",fontSize:10}}>{new Date(sig.created_at).toLocaleTimeString("fr-FR")}</span>
                      </div>
                      <div style={{display:"flex",gap:8,fontSize:10,alignItems:"center"}}>
                        {pnlUsd!=null && (
                          <span style={{color:pnlUsd>=0?"#34d399":"#f87171",fontWeight:800}}>{pnlUsd>=0?"+":""}{pnlUsd.toFixed(2)}$</span>
                        )}
                        <span style={{color:parseFloat(pnl)>=0?"#34d399":"#f87171",fontWeight:700}}>({pnl>0?"+":""}{pnl}%)</span>
                        {peakPct!=null ? <span style={{color:"#c084fc"}}>🏔️+{peakPct.toFixed(2)}%</span>
                          : peakUsdFallback!=null && <span style={{color:"#c084fc"}}>🏔️+{peakUsdFallback.toFixed(2)}$</span>}
                        <span style={{color:tp1?"#34d399":"#334155"}}>TP1{tp1?"✓":"○"}</span>
                        <span style={{color:tp2?"#34d399":"#334155"}}>TP2{tp2?"✓":"○"}</span>
                        <span style={{color:sl?"#f87171":"#334155"}}>SL{sl?"✗":"○"}</span>
                      </div>
                    </div>
                  );
                })
              }
            </div>
            <div style={{display:"flex",gap:10}}>
              <button onClick={async()=>{
                // v3.2 — FIX : re-recupere signaux/prix EN DIRECT au moment du
                // clic, au lieu d utiliser l etat React potentiellement
                // perime (le rafraichissement automatique toutes les 5s peut
                // etre ralenti par le navigateur si l onglet est en arriere-
                // plan — le rapport affichait alors une heure de generation
                // recente mais des prix bien plus vieux, sans le signaler).
                try{
                  const [freshSigs, freshPrices, freshStats] = await Promise.all([
                    apiCall("/api/signals?limit=50","GET",null,token),
                    apiCall("/api/prices","GET",null,token),
                    apiCall("/api/stats","GET",null,token),
                  ]);
                  const sigs = freshSigs?.signals||[];
                  const prc = freshPrices?.prices||{};
                  setSignals(sigs); setPrices(prc); setStats(freshStats);
                  downloadTxt(generateReport(sigs,freshStats||{},prc,email||"",paper),`hyperbot-${new Date().toISOString().slice(0,10)}.txt`);
                }catch(e){ alert("Erreur lors de la recuperation des donnees fraiches: "+e.message); }
              }}
                style={{flex:1,background:"linear-gradient(135deg,#1d4ed8,#7c3aed)",border:"none",borderRadius:8,padding:"11px",color:"#fff",fontWeight:700,fontSize:12}}>
                ⬇️ Telecharger .txt
              </button>
              <button onClick={async()=>{
                try{
                  const [freshSigs, freshPrices, freshStats] = await Promise.all([
                    apiCall("/api/signals?limit=50","GET",null,token),
                    apiCall("/api/prices","GET",null,token),
                    apiCall("/api/stats","GET",null,token),
                  ]);
                  const sigs = freshSigs?.signals||[];
                  const prc = freshPrices?.prices||{};
                  setSignals(sigs); setPrices(prc); setStats(freshStats);
                  const txt = generateReport(sigs,freshStats||{},prc,email||"",paper);
                  if(!txt || txt.length < 10) { alert("Rapport vide - rechargez la page"); return; }
                  navigator.clipboard.writeText(txt)
                    .then(()=>alert("✅ Copié ! (" + txt.length + " caractères)"))
                    .catch(()=>{
                      const ta = document.createElement("textarea");
                      ta.value = txt;
                      document.body.appendChild(ta);
                      ta.select();
                      document.execCommand("copy");
                      document.body.removeChild(ta);
                      alert("✅ Copié via fallback !");
                    });
                }catch(e){ alert("Erreur lors de la recuperation des donnees fraiches: "+e.message); }
              }}
                style={{flex:1,background:"#0f1629",border:"1px solid #1e2d4a",borderRadius:8,padding:"11px",color:"#94a3b8",fontWeight:700,fontSize:12}}>
                📋 Copier pour Claude
              </button>
            </div>
          </div>
        </div>
      )}

      <div style={{textAlign:"center",padding:"14px",color:"#1e2d4a",fontSize:10,borderTop:"1px solid #0f1629",marginTop:16}}>
        HyperBot AI — Serveur autonome 24h/24 · Powered by Claude
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
